version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/dockerfile
    container_name: sari_sari_ms_app
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    networks:
      - sari_sari_ms
    environment:
      VITE_DEV_SERVER_URL: "http://host.docker.internal:5173"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - sari_sari_ms

  node:
    build:
      context: .
      dockerfile: docker/node/dockerfile
    container_name: node
    volumes:
      - .:/var/www
      - /var/www/node_modules  # keep node_modules inside container
    ports:
      - "5173:5173"
    networks:
      - sari_sari_ms
    command: sh -c "npm install && npm run dev" # to keep it runninng (vite)
    tty: true                           # to keep it runninng (vite)

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: sari_sari_ms
      MYSQL_USER: user
      MYSQL_PASSWORD: user
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - sari_sari_ms
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - sari_sari_ms

networks:
  sari_sari_ms:

volumes:
  mysql_data:

